<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Login</title>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter','Segoe UI',sans-serif;color:#fff}
.serif{font-family:'Lora',Georgia,serif}
.bgp{position:absolute;inset:-60px;background:url(/_blob/735734087e0ed652b85bae0abf55ffbd) center/cover no-repeat;filter:blur(26px) brightness(.5) saturate(1.15)}
.bgs{position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(212,166,60,.18),transparent 45%),linear-gradient(180deg,rgba(11,18,32,.3),rgba(11,18,32,.75))}
.glass{background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(28px) saturate(1.3);backdrop-filter:blur(28px) saturate(1.3);border-radius:28px;box-shadow:0 34px 90px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;border-radius:14px;background:rgba(8,12,22,.4);border:1px solid rgba(255,255,255,.12);font-size:14px}
.lbl{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:8px}
.ph{background:linear-gradient(180deg,rgba(11,18,32,.05) 40%,rgba(11,18,32,.88) 100%),url(/_blob/735734087e0ed652b85bae0abf55ffbd) center/cover no-repeat}
</style>
</helmet>
<div style="position:relative;width:1280px;height:800px;overflow:hidden;background:#0b1220">
  <div class="bgp"></div><div class="bgs"></div>
  <div class="glass" style="position:absolute;left:150px;right:150px;top:90px;bottom:90px;padding:14px;display:flex;gap:14px">

    <div class="ph" style="width:520px;flex-shrink:0;border-radius:20px;padding:32px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:.14em"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4a63c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l18-8-6 16-3-7-9-1z"></path></svg>APP_NAME</div>
      <div>
        <div class="serif" style="font-size:38px;font-weight:500;line-height:1.12">Your next<br>horizon is<br>one seat away.</div>
        <div style="margin-top:18px;display:flex;gap:10px"><span style="width:26px;height:4px;border-radius:2px;background:#e8c46a"></span><span style="width:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)"></span><span style="width:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)"></span></div>
      </div>
    </div>

    <div style="flex-grow:1;padding:30px 40px 24px;display:flex;flex-direction:column;justify-content:center;gap:20px">
      <div><div style="font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#e8c46a">Welcome back</div>
        <div class="serif" style="font-size:34px;font-weight:500;margin-top:6px">Sign in</div>
        <div style="font-size:14px;color:rgba(255,255,255,.6);margin-top:6px">Manage flights, seats and bookings in one place.</div></div>

      <div><div class="lbl">Email</div>
        <div class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg><span style="color:rgba(255,255,255,.9)">david@example.com</span></div></div>

      <div><div style="display:flex;justify-content:space-between"><div class="lbl">Password</div><span style="font-size:12px;font-weight:600;color:#e8c46a">Forgot?</span></div>
        <div class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg><span style="letter-spacing:.3em;color:rgba(255,255,255,.9)">••••••••••</span></div></div>

      <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.7)"><span style="width:18px;height:18px;border-radius:6px;background:#e8c46a;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Keep me signed in</div>

      <div style="height:52px;border-radius:14px;background:linear-gradient(180deg,#d9ac47,#c4952f);color:#0b1220;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(212,166,60,.3)">Sign in</div>

      <div style="text-align:center;font-size:13px;color:rgba(255,255,255,.6)">New here? <span style="color:#e8c46a;font-weight:600">Create an account</span></div>
    </div>
  </div>
</div>
</x-dc>

</html>
