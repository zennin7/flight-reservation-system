<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${appName + ' – Available Flights'}">Sky Royal – Available Flights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/glass-web.css">
  <script defer src="/js/shell.js"></script>
</head>
<body>
  <div class="backdrop-aerial" aria-hidden="true"></div>
  <div class="glass-backdrop-scrim" aria-hidden="true"></div>

  <div class="page-shell is-framed-shell">
    <div class="inner-glass-frame">
      <div th:replace="~{fragments/shell :: topbar('flights')}"></div>

      <main class="frame-main">
        <form action="/flights" method="GET" class="glass-tile search-panel">
          <div class="search-grid">
            <label class="glass-tile field-tile">
              <span class="field-label">From</span>
              <select id="fOrigin" name="origin" class="field-control" required>
                <option value="Johannesburg (JNB)" th:selected="${origin == 'Johannesburg (JNB)'}">Johannesburg (JNB)</option>
                <option value="Cape Town (CPT)" th:selected="${origin == 'Cape Town (CPT)'}">Cape Town (CPT)</option>
                <option value="Durban (DUR)" th:selected="${origin == 'Durban (DUR)'}">Durban (DUR)</option>
              </select>
            </label>

            <label class="glass-tile field-tile">
              <span class="field-label">To</span>
              <select id="fDest" name="destination" class="field-control" required>
                <option value="Cape Town (CPT)" th:selected="${destination == 'Cape Town (CPT)'}">Cape Town (CPT)</option>
                <option value="Johannesburg (JNB)" th:selected="${destination == 'Johannesburg (JNB)'}">Johannesburg (JNB)</option>
                <option value="Durban (DUR)" th:selected="${destination == 'Durban (DUR)'}">Durban (DUR)</option>
              </select>
            </label>

            <label class="glass-tile field-tile">
              <span class="field-label">Departure Date</span>
              <input type="date" id="fDate" name="date" class="field-control" th:value="${date}" required>
            </label>

            <div class="search-submit-wrap">
              <button type="submit" class="btn-pill btn-white">Update Search</button>
            </div>
          </div>
        </form>

        <div th:if="${searchError != null}" class="status-banner is-error" role="alert">
          <strong>Search Note:</strong> <span th:text="${searchError}">Validation issue</span>
        </div>

        <section class="flights-legacy-list">
          <div class="frame-page-head">
            <h1 class="checkout-section-title" th:text="${'Available Flights (' + origin + ' &rarr; ' + destination + ')'}">
              Available Flights
            </h1>
            <span class="search-meta-note" th:text="${'Date: ' + date}">Date</span>
          </div>

          <div th:if="${flights.isEmpty() and searchError == null}" class="glass-tile content-glass-card">
            <h2 class="checkout-section-title">No Direct Flights Found</h2>
            <p class="auth-sub">We could not locate scheduled flights for this corridor on the selected date. Try searching another date or route.</p>
            <div>
              <a href="/flights" class="btn-pill btn-white">View Available JNB &rarr; CPT Flights</a>
            </div>
          </div>

          <div th:each="f : ${flights}" class="glass-tile flights-legacy-card">
            <div class="flight-meta">
              <span class="bp-flight-pill" th:text="${f.flightNumber}">SR 204</span>
              <div class="field-hint" th:text="${f.aircraftModel != null ? f.aircraftModel : 'Airbus A320'}">Airbus A320</div>
            </div>

            <div class="flight-schedule">
              <div>
                <div class="checkout-section-title" th:text="${f.departureTime}">06:30</div>
                <div class="field-hint" th:text="${origin}">JNB</div>
              </div>
              <div>
                <div class="field-hint" style="text-align: center;" th:text="${f.duration}">2h 10m</div>
                <div class="duration-track"></div>
              </div>
              <div>
                <div class="checkout-section-title" th:text="${f.arrivalTime}">08:40</div>
                <div class="field-hint" th:text="${destination}">CPT</div>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
              <div class="checkout-section-title" th:text="${f.priceFormatted}">R 1,200</div>
              <a th:href="@{'/flights/' + ${f.flightId} + '/seats'(origin=${origin},destination=${destination},departureDate=${date})}"
                 class="btn-pill btn-white">Select Flight &rarr;</a>
            </div>
          </div>
        </section>
      </main>

      <div th:replace="~{fragments/shell :: footer()}"></div>
    </div>
  </div>

  <div th:replace="~{fragments/shell :: mobileSheet('flights')}"></div>
</body>
</html>
