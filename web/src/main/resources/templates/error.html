<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${appName + ' – Notice'}">Sky Royal – Notice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/glass-web.css">
  <script defer src="/js/shell.js"></script>
</head>
<body>
  <div class="backdrop-aerial" aria-hidden="true"></div>
  <div class="glass-backdrop-scrim" aria-hidden="true"></div>

  <div class="page-shell is-framed-shell">
    <div class="inner-glass-frame">
      <div th:replace="~{fragments/shell :: topbar('')}"></div>

      <main class="frame-main">
        <div class="auth-shell">
          <section class="glass-tile content-glass-card" role="alert" aria-label="Notice">
            <span class="checkout-state-badge">Notice</span>
            <h1 class="checkout-title">Something went wrong</h1>
            <p class="auth-sub" th:text="${error}">We could not locate the requested page or action.</p>
            <div class="checkout-state-actions">
              <a href="/" class="btn-pill btn-white">Return to Home</a>
              <a href="/flights" class="btn-pill btn-translucent">Search Flights</a>
            </div>
          </section>
        </div>
      </main>

      <div th:replace="~{fragments/shell :: footer()}"></div>
    </div>
  </div>

  <div th:replace="~{fragments/shell :: mobileSheet('')}"></div>
</body>
</html>
