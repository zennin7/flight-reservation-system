<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${appName + ' – Log In'}">Sky Royal – Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/glass-web.css">
  <script defer src="/js/shell.js"></script>
</head>
<body>
  <div class="backdrop-aerial" aria-hidden="true"></div>
  <div class="glass-backdrop-scrim" aria-hidden="true"></div>

  <div class="page-shell is-framed-shell">
    <div class="inner-glass-frame">
      <div th:replace="~{fragments/shell :: topbar('')}"></div>

      <main class="frame-main">
      <div class="auth-shell">
        <section class="glass-panel auth-card" aria-label="Sign in">
          <div>
            <span class="eyebrow">Member Access</span>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Log in with your username or email to book faster and manage your flights.</p>
          </div>

          <div th:if="${loginError != null}" class="auth-error" role="alert">
            <span th:text="${loginError}">Incorrect username or password.</span>
          </div>

          <form action="/login" method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" th:value="${csrf_token}">
            <input type="hidden" name="next" th:if="${nextUrl != null}" th:value="${nextUrl}">

            <div class="field-group">
              <label for="uName" class="field-label">Username or Email</label>
              <input type="text" id="uName" name="username" class="field-control"
                     placeholder="e.g. customer or customer@example.com" required
                     th:value="${username != null ? username : ''}">
            </div>

            <div class="field-group">
              <label for="uPass" class="field-label">Password</label>
              <input type="password" id="uPass" name="password" class="field-control"
                     placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-pill btn-white auth-submit">
              Log In &rarr;
            </button>
          </form>

          <div class="auth-switch">
            New to Sky Royal? <a href="/register">Create an account</a>
          </div>

          <div class="auth-demo-box">
            Demo Admin: <code>testadmin</code> / <code>Passw0rd!</code><br>
            Demo Customer: <code>customer</code> / <code>Passw0rd!</code><br>
            <span>Username or email both work.</span>
          </div>
        </section>
      </div>
      </main>

      <div th:replace="~{fragments/shell :: footer()}"></div>
    </div>
  </div>
  <div th:replace="~{fragments/shell :: mobileSheet('')}"></div>
</body>
</html>
